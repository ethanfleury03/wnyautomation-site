<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10251e" />
    <title>Offline | WNY Business Automation</title>
    <style>
      :root {
        color: #10251e;
        background: #f6f7ef;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        min-height: 100dvh;
        margin: 0;
        padding: max(24px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
        place-items: center;
      }

      main {
        width: min(100%, 520px);
        padding: 24px;
        background: #ffffff;
        border: 1px solid #dce2d0;
        border-radius: 8px;
        box-shadow: 0 18px 48px rgba(16, 37, 30, 0.14);
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(1.8rem, 7vw, 2.5rem);
        line-height: 1.05;
      }

      p {
        margin: 0 0 18px;
        color: #586354;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        padding: 0 18px;
        color: #10251e;
        background: #d6ff3f;
        border-radius: 8px;
        font-weight: 760;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline.</h1>
      <p>Reconnect and refresh to keep using WNY Business Automation. Any workflow form draft you started on this device should still be waiting for you.</p>
      <a href="/">Try the site again</a>
    </main>
  </body>
</html>
